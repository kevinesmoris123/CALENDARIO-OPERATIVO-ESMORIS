<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153f6b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Calendario Esmoris"><title>Instalar Calendario Esmoris</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><style>:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17324d;background:#f4f7fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#fff;border:1px solid #dfe7ee;border-radius:20px;padding:30px;box-shadow:0 18px 60px #153f6b18;text-align:center}.brand{font-size:13px;letter-spacing:3px;color:#39a9dc}.brand strong{display:block;font-size:27px;letter-spacing:4px;color:#153f6b;margin-bottom:3px}.icon{width:96px;height:96px;margin:24px auto 12px;border-radius:22px;background:#eef7fb;display:grid;place-items:center}.icon img{width:78px;height:78px}h1{font-size:25px;margin:10px 0}p{line-height:1.5;color:#5c7183}.install{width:100%;border:0;border-radius:12px;padding:16px;background:#153f6b;color:#fff;font-size:16px;font-weight:800;cursor:pointer;margin-top:12px}.open{display:block;margin-top:14px;color:#087bb5;font-weight:700;text-decoration:none}.help{display:none;text-align:left;background:#f4f8fb;border-radius:12px;padding:15px;margin-top:18px;font-size:14px}.help b{color:#17324d}.ok{color:#18864b;font-weight:800}</style></head><body><main class="card"><div class="brand"><strong>UNIVERSO</strong>PISCINAS ESMORIS</div><div class="icon"><img src="icon.svg" alt="Calendario Esmoris"></div><h1>Calendario Operativo</h1><p>Instalalo en tu celular para abrirlo desde un ícono como una aplicación.</p><button id="install" class="install">📲 INSTALAR APP</button><div id="help" class="help"></div><a class="open" href="./">Abrir calendario sin instalar</a></main><script>let deferredPrompt=null;const btn=document.getElementById('install'),help=document.getElementById('help');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.textContent='📲 INSTALAR APP';});window.addEventListener('appinstalled',()=>{btn.textContent='✓ APP INSTALADA';btn.disabled=true;help.innerHTML='<span class="ok">Listo. Buscá “Calendario Esmoris” en la pantalla de inicio.</span>';help.style.display='block'});btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;return}const ua=navigator.userAgent||'',ios=/iPhone|iPad|iPod/i.test(ua),android=/Android/i.test(ua);help.style.display='block';if(ios){help.innerHTML='<b>En iPhone:</b><br>1. Abrí esta página en Safari.<br>2. Tocá Compartir ⬆️.<br>3. Elegí “Añadir a pantalla de inicio”.<br>4. Tocá “Añadir”.'}else if(android){help.innerHTML='<b>En Android:</b><br>Si abriste el enlace dentro de WhatsApp, Gmail o Facebook, tocá ⋮ y elegí <b>“Abrir en Chrome”</b>. Después volvé a tocar <b>INSTALAR APP</b> en esta pantalla.<br><br>Si Chrome no ofrece instalación, tocá ⋮ → “Agregar a pantalla principal”.'}else{help.innerHTML='<b>Instalación:</b><br>Abrí esta página en Chrome o Edge y usá la opción “Instalar aplicación” del navegador.'}});</script></body></html>
