<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario Operativo | Piscinas Esmoris</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div><strong>UNIVERSO</strong><span>PISCINAS ESMORIS</span></div><button id="exportBtn">EXPORTAR PROGRAMACIÓN</button></header><main><section class="toolbar"><div class="nav"><button id="prev">‹</button><button id="today">HOY</button><button id="next">›</button></div><h1 id="monthTitle"></h1><div class="view-switch"><button class="active">MES</button><button disabled>SEMANA</button><button disabled>LISTA</button></div></section><section class="filters"><label>Tipo <select id="typeFilter"><option value="all">Todos</option><option value="pool">Piscinas</option><option value="deck">Veredas</option></select></label><label>Equipo <select id="teamFilter"><option value="all">Todos</option><option>Instalaciones</option><option>Veredas</option><option>Instalaciones 2</option><option>Veredas 2</option></select></label><label>Estado <select id="statusFilter"><option value="all">Todos</option><option>Programado</option><option>Confirmado</option><option>En curso</option><option>Finalizado</option><option>Reprogramar</option></select></label><div class="legend"><span class="dot pool"></span> Piscina <span class="dot deck"></span> Vereda</div></section><section class="calendar-wrap"><div class="weekdays"><span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span><span>DOM</span></div><div id="calendar" class="calendar"></div></section></main><dialog id="jobDialog"><form id="jobForm"><input id="jobId" type="hidden"><div class="dialog-head"><h2 id="dialogTitle">NUEVO TRABAJO</h2><button type="button" id="closeDialog">×</button></div><div class="form-grid"><label>Tipo de trabajo<select id="jobType" required><option value="pool">Instalación de piscina</option><option value="deck">Vereda atérmica</option></select></label><label>Fecha de inicio<input id="jobDate" type="date" required></label><label>Fecha de fin<input id="endDate" type="date"></label><label>Cliente<input id="client" required placeholder="Nombre y apellido"></label><label>Teléfono<input id="phone" placeholder="Contacto"></label><label>Dirección<input id="address" required placeholder="Dirección de la obra"></label><label>Modelo de piscina<input id="model" placeholder="Ej. Jump M"></label><label>Medidas<input id="measures" placeholder="Ej. 6 x 2,35 x 1,20"></label><label>Color<input id="color" placeholder="Ej. Blanco / Travertino"></label><label>Equipo<select id="team"><option>Instalaciones</option><option>Veredas</option><option>Instalaciones 2</option><option>Veredas 2</option></select></label><label>Estado<select id="status"><option>Programado</option><option>Confirmado</option><option>En curso</option><option>Finalizado</option><option>Reprogramar</option></select></label><div id="poolFields" class="conditional wide"><label>Accesorios<textarea id="accessories" rows="2" placeholder="Luces, cascada, tablero, ionizador..."></textarea></label></div><div id="deckFields" class="conditional wide hidden"><div class="form-grid nested"><label>m² totales<input id="totalM2" type="number" step="0.01"></label><label>m² mano de obra<input id="laborM2" type="number" step="0.01"></label><label>Bordes atérmicos<input id="borders" type="number"></label><label>Rectos atérmicos<input id="straights" type="number"></label></div></div><label class="wide">Materiales / preparación<textarea id="materials" rows="2"></textarea></label><label class="wide">Observaciones<textarea id="notes" rows="3" placeholder="Acceso, restricciones, indicaciones para la cuadrilla..."></textarea></label></div><div class="dialog-actions"><button type="button" id="deleteBtn" class="danger hidden">ELIMINAR</button><span class="spacer"></span><button type="button" id="cancel">CANCELAR</button><button class="primary" type="submit">GUARDAR TRABAJO</button></div></form></dialog><dialog id="exportDialog"><form method="dialog"><div class="dialog-head"><h2>EXPORTAR PROGRAMACIÓN</h2><button type="button" id="closeExport">×</button></div><p>La exportación resumida y detallada para WhatsApp/PDF se incorporará en la siguiente etapa.</p><div class="dialog-actions"><button>ACEPTAR</button></div></form></dialog><script src="app.js"></script></body></html>
